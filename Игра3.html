<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Административное право</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at 20% 10%, #0f3d34 0%, #0a2a24 40%, #061814 100%);
    color: #e8f4ee;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 1100px;
    animation: fadeIn 0.5s ease;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- СТАРТ ---------- */
  #startScreen { text-align: center; }

  .start-box {
    background: linear-gradient(145deg, #123a30 0%, #1a4a3d 100%);
    border: 2px solid #3a9a7a;
    border-radius: 24px;
    padding: 60px 50px;
    max-width: 780px;
    margin: 0 auto;
    box-shadow: 0 25px 60px rgba(0,0,0,.55);
    position: relative;
    overflow: hidden;
  }
  .start-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(240,215,140,.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .emblem {
    width: 200px; height: 220px;
    margin: 0 auto 20px;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 6px 25px rgba(240,215,140,.35));
    animation: floatEmblem 4s ease-in-out infinite;
    position: relative; z-index: 1;
  }
  @keyframes floatEmblem {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }

  .start-title {
    font-size: 3rem; font-weight: 700; color: #f0d78c;
    letter-spacing: 2px; margin-bottom: 15px;
    text-shadow: 0 4px 25px rgba(240,215,140,.4);
    line-height: 1.15; position: relative; z-index: 1;
  }
  .start-subtitle {
    font-size: 1.15rem; color: #8fc8b8; margin-bottom: 10px;
    letter-spacing: 3px; text-transform: uppercase;
    position: relative; z-index: 1;
  }
  .start-divider {
    width: 140px; height: 3px;
    background: linear-gradient(90deg, transparent, #f0d78c, transparent);
    margin: 25px auto 35px;
  }
  .btn-start {
    padding: 18px 60px; font-size: 1.25rem; font-weight: 700;
    font-family: inherit; color: #0a2a24;
    background: linear-gradient(145deg, #d4b85a 0%, #f0d78c 100%);
    border: none; border-radius: 14px; cursor: pointer;
    transition: all .25s ease;
    box-shadow: 0 8px 25px rgba(240,215,140,.4);
    letter-spacing: 1px; position: relative; z-index: 1;
  }
  .btn-start:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 14px 35px rgba(240,215,140,.6); }

  /* ---------- ИГРОВОЕ ПОЛЕ ---------- */
  .hud {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; margin-bottom: 25px; flex-wrap: wrap;
  }
  .hud-title {
    font-size: 1.6rem; font-weight: 700; color: #f0d78c;
    letter-spacing: 1px;
  }
  .hud-counter {
    font-size: .95rem; color: #8fc8b8;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .progress-wrap {
    flex: 1 1 220px; height: 10px; border-radius: 6px;
    background: rgba(58,154,122,.2); overflow: hidden;
    border: 1px solid #2a5a4a;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #3a9a7a, #f0d78c);
    transition: width .5s ease;
    box-shadow: 0 0 12px rgba(240,215,140,.5);
  }

  /* Гексагональная сетка */
  .hexmap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 0;
  }
  .hex-row {
    display: flex;
    gap: 6px;
    margin-top: -14px;       /* перекрытие рядов — соты */
  }
  .hex-row:first-child { margin-top: 0; }

  .hex {
    position: relative;
    width: 130px; height: 150px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(160deg, #1f5a48 0%, #2d7a62 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .25s ease, filter .25s ease;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.45));
    opacity: 0;
    transform: scale(.6) translateY(20px);
    animation: hexIn .5s ease forwards;
  }
  @keyframes hexIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .hex::before {
    content: '';
    position: absolute;
    inset: 4px;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: linear-gradient(160deg, #123a30 0%, #1a4a3d 100%);
    transition: background .3s ease;
  }

  .hex .num {
    position: relative;
    z-index: 2;
    font-size: 2.6rem;
    font-weight: 800;
    color: #f0d78c;
    text-shadow: 0 3px 14px rgba(240,215,140,.45);
    transition: all .3s ease;
  }

  /* Пульсация доступных */
  .hex:not(.used) .num {
    animation: numPulse 2.2s ease-in-out infinite;
  }
  @keyframes numPulse {
    0%,100% { text-shadow: 0 3px 14px rgba(240,215,140,.45); }
    50%     { text-shadow: 0 3px 24px rgba(240,215,140,.9); }
  }

  .hex:not(.used):hover {
    transform: translateY(-6px) scale(1.06);
    filter: drop-shadow(0 12px 26px rgba(240,215,140,.5));
  }
  .hex:not(.used):hover::before {
    background: linear-gradient(160deg, #1a5a44 0%, #2a7a5e 100%);
  }

  /* Использованный гекс — гаснет */
  .hex.used {
    cursor: default;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)) grayscale(.7);
    opacity: .45;
    transform: scale(.94);
  }
  .hex.used::before {
    background: linear-gradient(160deg, #0d211c 0%, #122e26 100%);
  }
  .hex.used .num { color: #2f5a4a; animation: none; }

  .hex.used::after {
    content: '✓';
    position: absolute;
    z-index: 3;
    font-size: 2.4rem;
    color: #4a9a6a;
    opacity: .85;
  }
  .hex.used .num { visibility: hidden; }

  /* Вспышка при клике */
  .hex.flash {
    animation: flash .5s ease;
  }
  @keyframes flash {
    0%   { filter: drop-shadow(0 0 0 #f0d78c) brightness(1); }
    50%  { filter: drop-shadow(0 0 30px #f0d78c) brightness(1.8); }
    100% { filter: drop-shadow(0 0 0 #f0d78c) brightness(1); }
  }

  /* ---------- ВОПРОС ---------- */
  .question-box {
    background: linear-gradient(145deg, #123a30 0%, #1a4a3d 100%);
    border: 2px solid #3a9a7a;
    border-radius: 18px;
    padding: 50px 45px;
    min-height: 380px;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .question-number {
    font-size: .95rem; color: #8fc8b8; margin-bottom: 18px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .question-text {
    font-size: 1.75rem; line-height: 1.5; font-weight: 500;
    color: #fff; margin-bottom: 30px;
  }
  .answer-block {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .5s ease, opacity .5s ease, margin .4s ease;
  }
  .answer-block.visible { max-height: 500px; opacity: 1; margin-top: 10px; }
  .answer-label {
    font-size: .9rem; color: #f0d78c; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .answer-text {
    font-size: 1.35rem; line-height: 1.55; color: #c8f0dc;
    padding: 20px 25px;
    background: rgba(60,154,122,.15);
    border-left: 4px solid #4aba8a;
    border-radius: 8px;
  }

  .buttons {
    display: flex; gap: 15px; margin-top: 35px;
    justify-content: flex-end; flex-wrap: wrap;
  }
  .btn {
    padding: 14px 32px; font-size: 1.05rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    transition: all .25s ease; letter-spacing: .5px;
    font-family: inherit;
  }
  .btn-show {
    background: linear-gradient(145deg, #d4b85a 0%, #f0d78c 100%);
    color: #0a2a24;
    box-shadow: 0 4px 15px rgba(240,215,140,.3);
  }
  .btn-show:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(240,215,140,.45); }
  .btn-next {
    background: linear-gradient(145deg, #1a4a3d 0%, #266b56 100%);
    color: #f0d78c; border: 2px solid #3a9a7a;
    display: none;
  }
  .btn-next.visible { display: inline-block; }
  .btn-next:hover { transform: translateY(-3px); border-color: #f0d78c; }

  /* ---------- ФИНАЛ ---------- */
  .finish-btn {
    position: fixed; bottom: 25px; right: 25px;
    padding: 14px 28px; font-size: 1rem; font-weight: 600;
    font-family: inherit; color: #f0d78c;
    background: linear-gradient(145deg, #2a5a4a 0%, #3a7a62 100%);
    border: 2px solid #4a9a7a; border-radius: 12px;
    cursor: pointer; transition: all .25s ease;
    box-shadow: 0 6px 20px rgba(42,90,74,.5);
    letter-spacing: .5px; z-index: 100; display: none;
  }
  .finish-btn:hover { transform: translateY(-3px); border-color: #f0d78c; }

  #thanksScreen { text-align: center; }
  .thanks-box {
    background: linear-gradient(145deg, #123a30 0%, #1a4a3d 100%);
    border: 2px solid #3a9a7a; border-radius: 22px;
    padding: 80px 50px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    max-width: 800px; margin: 0 auto;
  }
  .thanks-title {
    font-size: 3.4rem; font-weight: 700; color: #f0d78c;
    margin-bottom: 30px; letter-spacing: 2px;
    text-shadow: 0 4px 25px rgba(240,215,140,.4);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 4px 25px rgba(240,215,140,.4); }
    50%     { text-shadow: 0 4px 40px rgba(240,215,140,.7); }
  }
  .thanks-divider {
    width: 120px; height: 3px;
    background: linear-gradient(90deg, transparent, #f0d78c, transparent);
    margin: 0 auto 35px;
  }
  .thanks-author { font-size: 1.3rem; color: #c8f0dc; margin-bottom: 50px; line-height: 1.6; }
  .thanks-author span {
    display: block; font-size: 1rem; color: #8fc8b8;
    margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase;
  }
  .thanks-author strong { color: #f0d78c; font-size: 1.5rem; font-weight: 600; }
  .btn-restart {
    padding: 16px 45px; font-size: 1.15rem; font-weight: 600;
    font-family: inherit; color: #0a2a24;
    background: linear-gradient(145deg, #d4b85a 0%, #f0d78c 100%);
    border: none; border-radius: 12px; cursor: pointer;
    transition: all .25s ease;
    box-shadow: 0 6px 20px rgba(240,215,140,.35);
  }
  .btn-restart:hover { transform: translateY(-3px); }

  /* ---------- Адаптив ---------- */
  @media (max-width: 900px) {
    .hex { width: 105px; height: 120px; }
    .hex .num { font-size: 2rem; }
    .hex-row { margin-top: -12px; }
  }
  @media (max-width: 700px) {
    .hexmap { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .hex-row { margin-top: 0; flex-wrap: wrap; justify-content: center; }
    .hex { width: 90px; height: 104px; }
    .hex .num { font-size: 1.8rem; }
    .start-box { padding: 40px 25px; }
    .emblem { width: 150px; height: 170px; }
    .start-title { font-size: 2rem; }
    .hud-title { font-size: 1.2rem; }
    .question-box { padding: 30px 22px; }
    .question-text { font-size: 1.25rem; }
    .answer-text { font-size: 1.05rem; padding: 15px 18px; }
    .btn { padding: 12px 22px; font-size: .95rem; }
    .thanks-title { font-size: 2.2rem; }
    .thanks-box { padding: 50px 25px; }
    .finish-btn { padding: 11px 20px; font-size: .9rem; bottom: 15px; right: 15px; }
  }
  @media (max-width: 420px) {
    .hex { width: 74px; height: 86px; }
    .hex .num { font-size: 1.5rem; }
  }
</style>
</head>

<!-- ЭКРАН 1: ИГРОВОЕ ПОЛЕ -->
<div class="screen" id="boardScreen">
  <div class="hud">
    <div class="hud-title">Административное право</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="hud-counter" id="hudCounter">Осталось: 12</div>
  </div>
  <div class="hexmap" id="hexmap"></div>
</div>

<!-- ЭКРАН 2: ВОПРОС -->
<div class="screen" id="questionScreen">
  <div class="question-box">
    <div>
      <div class="question-number" id="qNumber"></div>
      <div class="question-text" id="qText"></div>
      <div class="answer-block" id="answerBlock">
        <div class="answer-label">Ответ</div>
        <div class="answer-text" id="aText"></div>
      </div>
    </div>
    <div class="buttons">
      <button class="btn btn-show" id="showBtn">Посмотреть ответ</button>
      <button class="btn btn-next" id="nextBtn">Далее →</button>
    </div>
  </div>
</div>

<!-- ЭКРАН 3: СПАСИБО -->
<div class="screen" id="thanksScreen">
  <div class="thanks-box">
    <h1 class="thanks-title">Спасибо за внимание!</h1>
    <div class="thanks-divider"></div>
    <p class="thanks-author">
      <span>Автор игры</span>
      <strong>Хананова Зухра Риановна</strong>
    </p>
    <button class="btn-restart" id="restartBtn">Начать сначала</button>
  </div>
</div>

<button class="finish-btn" id="finishBtn">Закончить</button>

<script>
/* ============ ВОПРОСЫ ============ */
const questions = [
  {
    q: "Каков общий срок административного задержания по КоАП РФ?",
    a: "Не более 3 часов (за исключением отдельных случаев)."
  },
  {
    q: "Кто может выступать в качестве управляемой стороны в административно-правовых отношениях?",
    a: "Граждане, служащие, органы власти, организации, общественные объединения."
  },
  {
    q: "Что является главным признаком, отличающим административный договор от гражданско-правового?",
    a: "Хотя бы одной стороной выступает орган власти или управления."
  },
  {
    q: "Что из перечисленного является административным наказанием, а не дисциплинарным взысканием?",
    a: "Административный штраф (назначается органом власти, а не работодателем)."
  },
  {
    q: "Госслужащий выдаёт разрешение фирме, руководителем которой является его близкий родственник. Как это квалифицируется?",
    a: "Конфликт интересов — регулируется антикоррупционным законодательством."
  },
  {
    q: "Кто вправе назначить конфискацию орудия совершения или предмета административного правонарушения?",
    a: "Судья."
  },
  {
    q: "Административное расследование — это какая стадия производства по делу об административном правонарушении?",
    a: "Факультативная — проводится только по отдельным категориям дел."
  },
  {
    q: "В какой общий срок орган власти обязан дать письменный ответ на обращение гражданина?",
    a: "30 дней (нарушение срока — административное правонарушение по ст. 5.59 КоАП РФ)."
  },
  {
    q: "На кого возлагается обязанность доказывать законность привлечения к административной ответственности?",
    a: "На орган, вынесший постановление."
  },
  {
    q: "В чём принципиальное отличие административного задержания от административного ареста?",
    a: "Задержание — мера процессуального принуждения, арест — административное наказание; арест назначает только суд."
  },
  {
    q: "Как называется деяние, формально содержащее признаки административного правонарушения, но не представляющее существенной опасности?",
    a: "Малозначительное правонарушение — влечёт освобождение от ответственности."
  },
  {
    q: "Вправе ли государственные гражданские служащие организовывать или участвовать в забастовках?",
    a: "Нет — госслужащим забастовка запрещена."
  }
];

/* ============ DOM ============ */
const startScreen    = document.getElementById('startScreen');
const boardScreen    = document.getElementById('boardScreen');
const questionScreen = document.getElementById('questionScreen');
const thanksScreen   = document.getElementById('thanksScreen');
const hexmap         = document.getElementById('hexmap');
const qNumber        = document.getElementById('qNumber');
const qText          = document.getElementById('qText');
const aText          = document.getElementById('aText');
const answerBlock    = document.getElementById('answerBlock');
const showBtn        = document.getElementById('showBtn');
const nextBtn        = document.getElementById('nextBtn');
const finishBtn      = document.getElementById('finishBtn');
const restartBtn     = document.getElementById('restartBtn');
const startBtn       = document.getElementById('startBtn');
const progressBar    = document.getElementById('progressBar');
const hudCounter     = document.getElementById('hudCounter');

let usedCards = new Set();
let currentIndex = null;
let isOpening = false; // защита от двойного клика

function showScreen(screen) {
  [startScreen, boardScreen, questionScreen, thanksScreen].forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
  finishBtn.style.display = (screen === boardScreen) ? 'block' : 'none';
}

/* Раскладка гексов: 4-3-4-3-2 */
const layout = [4, 3, 4, 3, 2];

function buildBoard() {
  hexmap.innerHTML = '';
  let idx = 0;
  layout.forEach((count) => {
    const row = document.createElement('div');
    row.className = 'hex-row';
    for (let i = 0; i < count && idx < questions.length; i++) {
      const hex = document.createElement('div');
      hex.className = 'hex';
      if (usedCards.has(idx)) hex.classList.add('used');
      hex.style.animationDelay = (idx * 0.06) + 's';
      hex.innerHTML = '<span class="num">' + (idx + 1) + '</span>';
      hex.dataset.index = idx;
      row.appendChild(hex);
      idx++;
    }
    hexmap.appendChild(row);
  });
  updateProgress();
}

function updateProgress() {
  const total = questions.length;
  const done = usedCards.size;
  const left = total - done;
  progressBar.style.width = (done / total * 100) + '%';
  hudCounter.textContent = 'Осталось: ' + left;
}

/* Делегирование кликов — работает даже после пересоздания гексов */
hexmap.addEventListener('click', (e) => {
  const hex = e.target.closest('.hex');
  if (!hex) return;
  if (hex.classList.contains('used')) return;
  if (isOpening) return;

  const index = parseInt(hex.dataset.index, 10);
  if (isNaN(index)) return;

  isOpening = true;

  // визуальная вспышка, но экран меняем сразу
  hex.classList.add('used');
  updateProgress();

  openQuestion(index);
});

function openQuestion(index) {
  currentIndex = index;

  qNumber.textContent = 'Вопрос ' + (index + 1);
  qText.textContent = questions[index].q;
  aText.textContent = questions[index].a;

  answerBlock.classList.remove('visible');
  showBtn.style.display = 'inline-block';
  nextBtn.classList.remove('visible');

  showScreen(questionScreen);
  isOpening = false;
}

startBtn.addEventListener('click', () => {
  buildBoard();
  showScreen(boardScreen);
});

showBtn.addEventListener('click', () => {
  answerBlock.classList.add('visible');
  showBtn.style.display = 'none';
  nextBtn.classList.add('visible');
});

nextBtn.addEventListener('click', () => {
  if (currentIndex !== null) usedCards.add(currentIndex);
  currentIndex = null;
  buildBoard();
  showScreen(boardScreen);
});

finishBtn.addEventListener('click', () => showScreen(thanksScreen));

restartBtn.addEventListener('click', () => {
  usedCards = new Set();
  currentIndex = null;
  isOpening = false;
  buildBoard();
  showScreen(startScreen);
});

buildBoard();
showScreen(startScreen);
</script>

</body>
</html>
